# SmartStock IoT - configuracion base.
# Los valores sensibles se leen, de mayor a menor prioridad, de:
#   1) variables de entorno (DB_URL, DB_PASSWORD, ADMIN_PASSWORD, ...)
#   2) %USERPROFILE%\.smartstock\application.properties (lo crea el asistente de instalacion)
#   3) los valores por defecto de este archivo, que NO contienen contrasenas reales
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        # true cuando se sirva por HTTPS (la cookie de sesion no viajara por HTTP)
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: smartstock-iot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
    username: ${DB_USER:smartstock}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway crea el esquema; Hibernate solo lo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

smartstock:
  seguridad:
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    operador-password: ${OPERADOR_PASSWORD:Operador123!}
    device-key: ${DEVICE_KEY:dev-device-key-cambiar}
    # Si alguna clave conserva su valor de desarrollo el backend no arranca,
    # salvo que se permita con PERMITIR_CLAVES_DEV=true (solo en la PC de desarrollo).
    permitir-claves-desarrollo: ${PERMITIR_CLAVES_DEV:false}
  iot:
    # minutos sin contacto para considerar un dispositivo desconectado
    minutos-offline: ${IOT_MINUTOS_OFFLINE:2}
    # periodo del monitor de dispositivos (ms)
    monitor-ms: 30000
  ia:
    # Inteligencia artificial local (sin internet). Ollama ejecuta el modelo en esta PC; si no esta
    # instalado, el asistente usa su motor propio de aprendizaje. Solo se aceptan direcciones locales.
    habilitada: ${IA_HABILITADA:true}
    url: ${IA_URL:http://localhost:11434}
    modelo: ${IA_MODELO:qwen2.5:7b}
    tiempo-maximo-s: ${IA_TIEMPO_MAXIMO_S:180}
  ventas:
    # porcentaje de IGV incluido en los precios
    igv-pct: ${IGV_PCT:18}
  estimacion:
    # % de diferencia entre estimado y registrado para abrir discrepancia
    umbral-pct: ${UMBRAL_DISCREPANCIA_PCT:10}
    # diferencia minima en unidades (evita discrepancias por ruido)
    umbral-unidades: 1
    # lecturas de peso consecutivas que deben superar el umbral para abrir una discrepancia
    # (evita discrepancias por una mano apoyada o un objeto colocado un instante)
    lecturas-confirmacion: ${LECTURAS_CONFIRMACION:3}

# Solo /actuator/health (lo usan Docker y el instalador para saber si el servidor esta listo)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    pe.edu.unaj.smartstock: INFO
