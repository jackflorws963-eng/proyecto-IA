server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring:
  application:
    name: smartstock-iot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
    username: ${DB_USER:smartstock}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

smartstock:
  seguridad:
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    operador-password: ${OPERADOR_PASSWORD:Operador123!}
    device-key: ${DEVICE_KEY:dev-device-key-cambiar}
    permitir-claves-desarrollo: ${PERMITIR_CLAVES_DEV:false}
  iot:
    minutos-offline: ${IOT_MINUTOS_OFFLINE:2}
    monitor-ms: 30000
  ia:
    habilitada: ${IA_HABILITADA:true}
    url: ${IA_URL:http://localhost:11434}
    modelo: ${IA_MODELO:qwen2.5:7b}
    tiempo-maximo-s: ${IA_TIEMPO_MAXIMO_S:180}
  ventas:
    igv-pct: ${IGV_PCT:18}
  estimacion:
    umbral-pct: ${UMBRAL_DISCREPANCIA_PCT:10}
    umbral-unidades: 1
    lecturas-confirmacion: ${LECTURAS_CONFIRMACION:3}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    pe.edu.unaj.smartstock: INFO
