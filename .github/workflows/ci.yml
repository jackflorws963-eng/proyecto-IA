# SmartStock IoT - integracion continua: compila y ejecuta las pruebas unitarias y de integracion
# contra un PostgreSQL real en cada push y pull request.  Autor: Brayan (BR)
name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartstock_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas unitarias e integracion
        run: ./mvnw -B verify
        env:
          RUN_IT: "true"
          DB_URL: jdbc:postgresql://localhost:5432/smartstock_test
          DB_USER: postgres
          DB_PASSWORD: postgres

  docker:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen del servidor
        run: docker build -t smartstock-iot .
